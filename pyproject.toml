[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-agents"
version = "0.1.0"
description = "Single-question multi-agent orchestration for exam production"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
deepseek = [
  "deepseek-harness-sdk>=0.2.2rc2",
]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
exam-agents = "exam_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_harness: invokes the real DeepSeek Harness runtime",
]

